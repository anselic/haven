[workspace]
resolver = "2"
members = [
    "crates/haven_common",
    "crates/haven_front",
    "crates/haven_mid",
    "crates/haven_back",
    "crates/haven_meta",
    "bins/vestry",
    "bins/havenc",
    "bins/havendoc",
]

# Shared dependency versions, inherited by members via `{ workspace = true }`.
[workspace.dependencies]
haven_common = { path = "crates/haven_common" }
haven_front = { path = "crates/haven_front" }
haven_mid = { path = "crates/haven_mid" }
haven_back = { path = "crates/haven_back" }
haven_meta = { path = "crates/haven_meta" }

ariadne = "0.6.0"
# ariadne's colour backend. Depended on directly so diagnostics can reach yansi's
# global switch. the version must stay compatible with ariadne
yansi = "1.0"
bumpalo = "3.20.3"
chumsky = { git = "https://codeberg.org/zesterer/chumsky", rev = "b4c0054bc1", features = ["pratt"] }
clap = { version = "4.6.1", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
tempfile = "3.27.0"
cc = "1.2.65"
libtest-mimic = "0.8"

[workspace.package]
version = "0.1.0"
edition = "2024"
