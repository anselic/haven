<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="havendoc">
  <title>{{ title }} · Haven docs</title>
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  <script src="{{ root }}assets/search-index.js" defer></script>
  <script src="{{ root }}assets/search.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-identity">
      <a class="brand" href="{{ root }}index.html">
        <span>haven docs</span>
      </a>
      <span class="package-name">{{ package }}</span>
    </div>
    <button class="search-trigger" type="button" data-root="{{ root }}" aria-haspopup="dialog" aria-controls="search-dialog">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      <span>Search documentation</span>
      <kbd>/</kbd>
    </button>
  </header>
  <dialog id="search-dialog" aria-label="Search documentation">
    <div class="search-panel">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
        <input id="search-input" type="search" aria-label="Search documentation" placeholder="Search modules, types, functions…" autocomplete="off">
        <button class="search-close" type="button" aria-label="Close search">Esc</button>
      </div>
      <p class="search-status" aria-live="polite">Type to search the documentation.</p>
      <ul class="search-results"></ul>
    </div>
  </dialog>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="Modules">
        <p class="nav-title">Modules</p>
        <ul>{{ navigation }}</ul>
      </nav>
    </aside>
    <main id="content">{{ content }}</main>
  </div>
  <footer>Generated by <code>havendoc</code></footer>
</body>
</html>
